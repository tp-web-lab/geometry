<style id="tp-md-references-styles" data-tp-markdown-style="tp-md-references-styles">

<style id="tp-md-layout-styles" data-tp-markdown-style="tp-md-layout-styles">
.stack {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: var(--layout-space, 0.5rem);
}

.stack > * {
  margin-block: 0;
}

.stack > * + * {
  margin-block-start: var(--layout-space, 0.5rem);
}

.cluster {
  display: flex;
  flex-wrap: wrap;
  gap: var(--layout-space, 0.5rem);
  justify-content: var(--cluster-justify, flex-start);
  align-items: var(--cluster-align, center);
}

.switcher {
  display: flex;
  flex-wrap: wrap;
  gap: var(--layout-space, 0.5rem);
  --switcher-limit: attr(limit number, 2);
}

.switcher > * {
  flex-grow: 1;
  flex-basis: calc((var(--switcher-threshold, 40rem) - 100%) * 999);
}


.switcher > tp-l-system {
  flex: 1 1 18rem;
  min-inline-size: 0;
}

.switcher > tp-l-system .tp-l-system-figure {
  margin: 0;
  display: flex;
  flex-direction: column; /* important */
  align-items: stretch;
  justify-content: flex-start;
  gap: 0.5rem;
  inline-size: 100%;
}

.switcher > tp-l-system .tp-l-system-svg,
.switcher > tp-l-system svg {
  display: block;
  inline-size: 100%;
  max-inline-size: 100%;
  block-size: auto;
}


.switcher.feature-list > article {
  flex: 0 0 250px;
}
.switcher.code-list > article {
  flex: 0 0 400px;
}

.sidebar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--layout-space, 0.5rem);
}

.sidebar > :first-child {
  flex-basis: var(--sidebar-width, 10rem);
  flex-grow: 1;
}

.sidebar > :last-child {
  flex-basis: 0;
  flex-grow: 999;
  min-inline-size: var(--sidebar-content-min, 70%);
}

.cover {
  display: flex;
  flex-direction: column;
  min-block-size: var(--cover-min-block-size, 100vh);
  padding: var(--cover-padding, 1rem);
}

.cover > * {
  margin-block: var(--layout-space, 0.5rem);
}

.cover > :first-child:not(.centered) {
  margin-block-start: 0;
}

.cover > :last-child:not(.centered) {
  margin-block-end: 0;
}

.cover > .centered {
  margin-block: auto;
}

.center {
  box-sizing: content-box;
  max-inline-size: var(--center-max-inline-size, 60rem);
  margin-inline: auto;
  padding-inline: var(--center-padding, 1rem);
}

.grid {
  display: grid;
  gap: var(--layout-space, 0.5rem);
  grid-template-columns: repeat(
    auto-fit,
    minmax(min(var(--grid-min, 16rem), 100%), 1fr)
  );
}

.reel {
  display: flex;
  gap: var(--layout-space, 0.5rem);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-color: currentColor transparent;
}

.reel > * {
  flex: 0 0 var(--reel-item-width, auto);
}

.reel > img {
  block-size: 100%;
  flex-basis: auto;
  width: auto;
}

.reel > * + * {
  margin-inline-start: 1rem;
}

.reel.overflowing {
  padding-block-end: 1rem;
}

.card {
  display: flex;
  flex-direction: column;
  gap: var(--layout-space, 0.5rem);
  padding: var(--card-padding, 1rem);
  border: var(--card-border, 1px solid color-mix(in srgb, CanvasText 18%, transparent));
  border-radius: var(--card-radius, 0.75rem);
  background: var(--card-background, Canvas);
  color: var(--card-color, CanvasText);
}

.card > :first-child {
  margin-block-start: 0;
}

.card > :last-child {
  margin-block-end: 0;
}
</style>

<style id="tp-md-mdviewer-styles" data-tp-markdown-style="tp-md-mdviewer-styles">
